# Publishes the three pages to GitHub Pages.
#
# There is nothing to compile — cards.html, dj.html and show.html are the whole
# program — so "deploy" here means "serve them from a URL". That is worth doing
# for three reasons:
#
#   * the party laptop, the projector laptop and your phone all reach the same
#     pages without copying files around;
#   * show.html can follow dj.html, which needs both pages on one real origin
#     and does not work over file://;
#   * you can change the song list from the GitHub web editor on a phone and
#     have it live a minute later.
#
# The checks run on pushes AND on pull requests, so a change is validated before
# you decide to merge it rather than after it is already live. Only pushes and
# manual runs publish; a pull request never touches the live site.
#
# Runs on every push to the default branch, and on demand from the Actions tab
# (including the GitHub mobile app) via "Run workflow".
#
# ONE-TIME SETUP: Settings -> Pages -> Build and deployment -> Source:
# "GitHub Actions". Until that is set, this workflow will fail at the deploy
# step with a message saying Pages is not enabled.

name: Deploy to Pages

on:
  push:
    branches: [feat/dj-bingo]
  pull_request:
    branches: [feat/dj-bingo]
  workflow_dispatch:

# Least privilege by default; the deploy job asks for what it needs.
permissions:
  contents: read

# Superseded runs for the same branch are pointless, so drop them. Scoped by ref
# so that a pull request check never cancels a deploy that is already running.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check the songs and the win conditions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 'lts/*'
      # Fails the deploy on broken song data or a win condition that does not
      # hold; reports the night's expected running time either way, onto the
      # run summary so it can be read from a phone.
      - run: node test/check.js

  deploy:
    name: Publish
    needs: check
    # A pull request gets the checks and nothing else — it must never publish.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - id: deployment
        uses: actions/deploy-pages@v4
